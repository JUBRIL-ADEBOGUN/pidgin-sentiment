[project]
name = "pidgin-senti"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "ftfy>=6.2",
    "emoji>=2.11",
    "numpy>=1.26",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "prometheus-client>=0.20",
]
serve-baseline = [
    "joblib>=1.4",
    "scikit-learn>=1.5",
]
train = [
    "datasets>=3.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pandera[pandas]>=0.24",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "transformers[torch]>=4.45,<5.0",
    "accelerate>=0.26.0",
    "optimum[onnxruntime]>=1.22",
    "mlflow>=2.16",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pidgin_senti"]