name: ML CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python & install serve + dev deps
        run: |
          uv python install 3.11
          uv sync --extra serve --extra dev

      - name: Ruff lint & format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run unit & contract tests
        run: uv run pytest -v

  docker-smoke-test:
      runs-on: ubuntu-latest
      needs: lint-and-test
      steps:
        - uses: actions/checkout@v4

        - name: Build slim CPU serving image
          run: docker build --build-arg PIP_EXTRAS="serve" -t pidgin-senti:ci .

        - name: Verify slim image runtime & size
          run: |
            docker images pidgin-senti:ci
            docker run --rm pidgin-senti:ci python -c \
              "import fastapi, onnxruntime, tokenizers; print('Slim ONNX CPU container OK')"